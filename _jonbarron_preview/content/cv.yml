    Research Experience:
      - company: Robot Vacuum Cleaner SW Lab – Perception Team, Samsung Electronics
        position: Software Engineer, Spatial AI Development
        location: Suwon, South Korea
        start_date: May 2026
        end_date: Present
        summary: Spatial AI for Resource-Constrained Robot Vacuum Cleaners
        highlights:
          - Developed a dual-process robot intelligence architecture inspired by human cognition combining task knowledge reuse and incremental scene-graph enrichment to reduce repeated reasoning on resource-constrained robots.
          - Developed a viewpoint selection algorithm that selects navigation coordinates for robots to acquire object information based on visibility and accessibility.
          - Developed room classification using object occurrence likelihoods and spatially accumulated visual evidence from observations collected during navigation.
          - Integrated VLM, perception, and navigation into a unified Spatial AI system and validated in NVIDIA Isaac Sim.
      - company: Seoul National University, Wearable Robotics Laboratory
        position: Research Intern
        advisor: Prof. Jinsoo Kim
        location: Seoul, South Korea
        start_date: Dec. 2024
        end_date: Feb. 2025
        summary: Embedded Controller and Sensor Integration for a Soft Exosuit
        highlights:
          - Developed a real-time onboard controller for a tendon-driven soft exosuit.
          - Built a tendon-driven soft exosuit pipeline with 10-ms end-to-end processing from sensor measurements to motor commands using multithreaded CAN communication.
          - Designed a sensor integration module connecting wearable sensors, actuators, and the controller.
      - company: Korea University, Human-Machine Systems Lab
        position: Graduate Researcher
        advisor: Prof. Shinsuk Park
        location: Seoul, South Korea
        start_date: Sep. 2022
        end_date: Dec. 2024
        summary: Monocular Vision-Based Assistance Interface for Indoor Drones
        highlights:
          - Developed a monocular vision-based pilot assistance interface to reduce human error during indoor UAV operation.
          - Applied monocular depth estimation for obstacle perception using a single RGB camera on a lightweight UAV.
          - "Evaluated the interface with six participants in simulation: NASA-TLX mental demand decreased by approximately 43%, and mean System Usability Scale scores increased from 62.5 to 80 versus the RGB interface."
      - company: Drexel University, Intelligent Machine Perception and Learning (IMAPLE) Lab
        position: Visiting Researcher
        advisor: Prof. David Han
        location: Philadelphia, PA, USA
        start_date: Sep. 2023
        end_date: Feb. 2024
        highlights:
          - Applied CycleGAN-based domain transfer to generate realistic training data from synthetic images for sim-to-real monocular depth estimation.
          - Improved monocular depth estimation using mixed real and domain-transferred synthetic data.
          - Developed a helium-supported aerial robot with Raspberry Pi–ESP32 hardware and laptop-based YOLOv5 tracking for video streaming and motor commands.
